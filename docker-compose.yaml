services:
  express:
    image: ${IMAGE:-ghcr.io/creative-computing-society/my-app:latest}
    container_name: ${APP_NAME:-my-app}
    restart: unless-stopped
    env_file: .env
    build:
      context: express
      dockerfile: Dockerfile
    expose:
      - "3000"

    networks:
      - coolify
      - internal

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  colyseus:
    image: ${IMAGE:-ghcr.io/creative-computing-society/my-app:latest}
    container_name: ${APP_NAME:-my-app}
    restart: unless-stopped
    env_file: .env
    build:
      context: colyseus
      dockerfile: Dockerfile
    expose:
      - "3000"

    networks:
      - coolify
      - internal

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  coolify:
    external: true
  internal:
    driver: bridge